role: critic
id: critic-002
language: ru
input: |
  План эксперимента. Гипотеза: кэширование промежуточных результатов ускоряет обработку
  запросов. Проверка: запускаем систему с кэшем один раз и измеряем время ответа.
  Если время ответа получится меньше секунды, гипотеза подтверждена.
expected:
  must_mention:
    - "нет запуска без кэша"
    - "один прогон недостаточен"
    - "порог в секунду произволен"
  must_not:
    - "предложения сменить тему исследования"
rubric: rubrics/critic.md
