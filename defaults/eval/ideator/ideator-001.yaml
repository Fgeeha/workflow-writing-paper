role: ideator
id: ideator-001
language: ru
input: |
  Мы научились запускать небольшую языковую модель на старом ноутбуке без видеокарты так,
  чтобы она отвечала на вопросы по внутренней документации предприятия. Для этого мы
  сжали модель и заранее разбили документы на фрагменты. Хотим статью про то, что это
  вообще возможно и что качество приемлемое.
expected:
  must_mention:
    - "критерий приемлемого качества"
    - "сравнение с моделью без сжатия"
    - "какие данные нужны от автора"
  must_not:
    - "придуманные числа"
rubric: rubrics/ideator.md
