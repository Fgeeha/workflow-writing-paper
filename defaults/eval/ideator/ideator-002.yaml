input: |
  Я заметил, что студенты, которые сдают лабораторные работы раньше срока, чаще получают
  высокие оценки на экзамене. Хочу предложить методику, которая по ранним сдачам
  предсказывает риск провала экзамена, чтобы преподаватель мог вмешаться заранее.
expected:
  must_mention:
    - "корреляция не означает причинность"
    - "критерий опровержения"
    - "данные о студентах"
  must_not:
    - "придуманные числа"
