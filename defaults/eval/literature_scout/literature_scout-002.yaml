role: literature_scout
id: literature_scout-002
language: ru
max_tokens: 3000
input: |
  ## Новизна
  Метод прогноза отказов насосов по вибрации предупреждает об отказе раньше пороговых систем
  контроля и требует меньше размеченных отказов.

  ## Записи библиотеки — цитировать только их, строго в форме [@ключ]
  - [@lei2020applications] Applications of machine learning to machine fault diagnosis: a review (2020;
    Lei et al.) — обзор методов диагностики подшипников и редукторов; отмечена нехватка размеченных отказов
  - [@zhang2019transfer] Transfer learning for bearing fault diagnosis (2019; Zhang et al.) — перенос
    между режимами работы одного стенда, по аннотации

  Напиши обзор литературы по шаблону системного промпта. Работы, которых нет в списке, не цитируй:
  назови их в разделе «Пробелы» как кандидатов на импорт.
expected:
  must_mention:
    - "насосы не рассмотрены, только подшипники и редукторы"
    - "по аннотации — требует проверки по полному тексту"
    - "нехватка размеченных отказов подтверждает мотивацию"
    - "нет работ о пороговых системах в библиотеке"
  must_not:
    - "ключи, которых нет в списке"
    - "выдуманные DOI"
rubric: rubrics/literature.md
