role: literature_scout
id: literature_scout-001
language: ru
max_tokens: 3000
input: |
  ## Новизна
  Классификатор болезней растений, работающий на одноплатном компьютере в поле, распознаёт
  болезни на снимках с телефона точнее, чем модели, обученные на лабораторных снимках.

  ## Записи библиотеки — цитировать только их, строго в форме [@ключ]
  - [@hughes2015open] An open access repository of images on plant health (2015; Hughes, Salathé) — набор
    снимков листьев на однородном фоне, снятых в лаборатории
  - [@mohanty2016using] Using deep learning for image-based plant disease detection (2016; Mohanty et al.) —
    точность на лабораторных снимках высокая, на снимках из интернета падает до 31 %
  - [@howard2019searching] Searching for MobileNetV3 (2019; Howard et al.) — архитектура для мобильных
    устройств, оценка на ImageNet

  Напиши обзор литературы по шаблону системного промпта. Работы, которых нет в списке, не цитируй:
  назови их в разделе «Пробелы» как кандидатов на импорт.
expected:
  must_mention:
    - "падение точности вне лаборатории"
    - "нет работ о полевых снимках в библиотеке"
    - "MobileNetV3 не проверялась на болезнях растений"
    - "кандидаты на импорт без ключей"
  must_not:
    - "ключи, которых нет в списке"
    - "числа, которых нет во фрагментах"
rubric: rubrics/literature.md
