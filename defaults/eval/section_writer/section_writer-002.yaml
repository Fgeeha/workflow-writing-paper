role: section_writer
id: section_writer-002
language: ru
max_tokens: 2500
input: |
  ## Профиль журнала
  sections: [Введение, Метод, Эксперимент, Заключение]
  numbers: {decimal_separator: ",", rounding: 2}

  ## Реестр результатов — единственный источник чисел (цитируемы только поля value; note — пояснение, числа из него в текст не переносятся)
  {"train_time_speedup": {"value": 1.8, "unit": "раз"}, "auc_drop": {"value": 0.004, "unit": ""}}

  ## Одобренная новизна
  Отбор признаков сокращает время обучения модели оттока вдвое без потери качества (допуск по AUC — 0,01).

  ## Уже написанные разделы
  ## Эксперимент
  Время обучения сократилось в 1,8 раза, AUC снизилась на 0,004, что в пределах допуска.

  Напиши раздел «Заключение».
expected:
  must_mention:
    - "в 1,8 раза, а не вдвое"
    - "снижение AUC в пределах допуска"
    - "ограничение: одна отрасль"
  must_not:
    - "вдвое"
    - "новые числа, которых нет в разделе «Эксперимент»"
rubric: rubrics/draft.md
