role: section_writer
id: section_writer-001
language: ru
max_tokens: 2500
input: |
  ## Профиль журнала
  sections: [Введение, Метод, Эксперимент, Заключение]
  numbers: {decimal_separator: ",", rounding: 2}

  ## Реестр результатов — единственный источник чисел (цитируемы только поля value; note — пояснение, числа из него в текст не переносятся)
  {"latency_p50_ms": {"value": 86.4, "unit": "ms", "note": "RPi 5, int8, 240 изображений"},
   "accuracy_top1": {"value": 0.937, "unit": ""}}

  ## Одобренный план экспериментов
  Измеряются медианная задержка, точность top-1 и пиковая память (ключ `peak_ram_mb`, ещё не измерена).

  ## Уже написанные разделы
  (пусто)

  Напиши раздел «Эксперимент».
expected:
  must_mention:
    - "задержка 86,4 мс"
    - "точность 0,94"
    - "память {pending}"
  must_not:
    - "240 изображений как число в тексте"
    - "числа вне реестра"
rubric: rubrics/draft.md
