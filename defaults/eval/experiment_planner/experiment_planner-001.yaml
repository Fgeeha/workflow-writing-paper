role: experiment_planner
id: experiment_planner-001
language: ru
max_tokens: 3000
input: |
  ## Новизна
  1. Сжатие языковой модели до 4 бит позволяет отвечать на вопросы по внутренней документации
     на ноутбуке без видеокарты с качеством не хуже облачного сервиса.
  2. Предварительная разбивка документов на фрагменты по заголовкам точнее разбивки фиксированной длины.

  ## Указания автора (ресурсы, данные, ограничения)
  Ноутбук: 16 ГБ памяти, 4 ядра. Есть 300 вопросов с эталонными ответами от сотрудников.
  Облачный сервис доступен, но платный: не более 300 запросов.
expected:
  must_mention:
    - "базовая линия без сжатия"
    - "облачный сервис как верхняя граница"
    - "ключ реестра для задержки"
    - "критерий опровержения «не хуже»"
    - "число прогонов"
  must_not:
    - "придуманные результаты"
    - "эксперименты на видеокарте"
rubric: rubrics/experiment_plan.md
