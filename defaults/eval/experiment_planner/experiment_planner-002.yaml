role: experiment_planner
id: experiment_planner-002
language: ru
max_tokens: 3000
input: |
  ## Новизна
  Новый метод отбора признаков сокращает время обучения модели прогноза оттока клиентов
  вдвое без потери качества, и выигрыш сохраняется на данных другой отрасли.

  ## Обзор литературы
  Близкие работы сравнивают отбор признаков только по качеству, время обучения не измеряют.
  Открытые наборы данных об оттоке есть для связи и банков.

  ## Указания автора (ресурсы, данные, ограничения)
  Собственные данные — одна телеком-компания, 50 тысяч клиентов. Сервер с 32 ядрами.
expected:
  must_mention:
    - "второй набор данных другой отрасли"
    - "что значит без потери качества — допуск"
    - "несколько сидов и разброс"
    - "время обучения с одинаковым железом"
    - "ключи реестра snake_case"
  must_not:
    - "придуманные результаты"
rubric: rubrics/experiment_plan.md
