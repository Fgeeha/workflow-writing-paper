# Образец профиля журнала: скопируйте в workspace/journals/<id>.yaml и укажите `journal: <id>` в манифесте.
# Весь профиль целиком видят роли и судьи как контекст; проверки кодом — у полей с пометкой [checker].
id: example
language: ru                      # язык статьи по умолчанию для новых проектов

# Разделы черновика в порядке статьи: стадия draft пишет их по одному, черновик полон, когда есть все.
sections: [Аннотация, Введение, Обзор литературы, Метод, Эксперимент, Обсуждение, Заключение]

limits:
  abstract_words: 250             # [checker] слов в разделе «Аннотация» / «Abstract»
  body_pages: 12                  # [checker] страниц текста, оценка по словам
  words_per_page: 500             # слов на страницу для этой оценки: 500 — кегль 14, интервал 1,5
  references_min: 15              # [checker] различных ключей [@ключ] в тексте не меньше

numbers:
  rounding: 2                     # [checker] знаков после запятой: значение реестра в тексте можно округлить
  decimal_separator: ","          # подсказка ролям; checker принимает и «,», и «.»

citation_style: gost-2008         # подсказка ролям; оформление списка при экспорте — CSL pandoc по умолчанию
